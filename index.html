<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garfield Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-grid"></div>

    <!-- NAVBAR MÓVIL -->
    <nav class="navbar">
        <button class="menu-btn" id="menu-btn">☰</button>
        <div class="nav-brand">🐱 GARFIELD</div>
        <button class="cart-btn" id="cart-btn">🛒<span id="cart-count">0</span></button>
    </nav>

    <!-- MENÚ LATERAL -->
    <div class="sidebar" id="sidebar">
        <button class="close-btn" id="close-btn">✖</button>
        <h3>MENÚ</h3>
        <a href="#" class="nav-link" data-target="inicio">🏠 INICIO</a>
        <a href="#" class="nav-link" data-target="tienda">🛒 TIENDA</a>
        <a href="https://wa.me/51927174369" target="_blank">💬 WHATSAPP</a>
        <a href="#" id="ver-carrito">🧡 VER CARRITO</a>
    </div>
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <!-- INICIO -->
        <section class="main-section active" id="inicio">
            <header class="hero">
                <div class="hero-img">
                    <img src="logo.png" alt="Garfield Store">
                </div>
                <div class="hero-text">
                    <h1 class="logo">GARFIELD STORE</h1>
                    <p class="subtitle">Diamantes & Servicios Premium 🍝</p>
                    <a href="#" class="cta-btn" data-target="tienda">🛒 IR A LA TIENDA</a>
                </div>
            </header>
        </section>

        <!-- TIENDA -->
        <section class="main-section" id="tienda">
            <h1 class="logo">🛒 TIENDA</h1>

            <div class="country-tabs">
                <button class="tab-btn active" data-country="pe">🇵🇪</button>
                <button class="tab-btn" data-country="cl">🇨🇱</button>
                <button class="tab-btn" data-country="ar">🇦🇷</button>
                <button class="tab-btn" data-country="mx">🇲🇽</button>
                <button class="tab-btn" data-country="bo">🇧🇴</button>
                <button class="tab-btn" data-country="uy">🇺🇾</button>
            </div>

            <div class="card">
                <h2>💎 DIAMANTES</h2>
                <div id="precios-container"></div>
            </div>

            <h2 style="text-align:center; margin:30px 0; color:var(--garfield-orange)">🛍️ SERVICIOS</h2>
            <div class="tienda-grid" id="tienda-grid"></div>
        </section>
    </div>

    <!-- MODAL PRODUCTO -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">✖</button>
            <img id="modal-img" src="" alt="">
            <h3 id="modal-title"></h3>
            <p id="modal-desc"></p>
            <p id="modal-price"></p>
            <button class="cta-btn" id="btn-add-cart">AÑADIR AL CARRITO</button>
        </div>
    </div>

    <!-- MODAL CARRITO -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-cart">✖</button>
            <h3>🧡 TU CARRITO</h3>
            <div id="cart-items"></div>
            <p id="cart-total"></p>
            <a href="#" class="cta-btn" id="btn-checkout">PEDIR POR WHATSAPP</a>
        </div>
    </div>

    <script src="monedas.js"></script>
    <script src="productos.js"></script>
    <script src="tienda.js"></script>
    <script src="script.js"></script>
</body>
</html>
