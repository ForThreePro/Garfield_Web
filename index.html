<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARFIELD STORE | CYBER ELITE</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700;900&family=Zen+Dots&display=swap" rel="stylesheet">
<style>
  :root{
    --naranja: #FF7B00;
    --naranja-glow: #FFB200;
    --negro: #000;
    --vidrio: rgba(5, 5, 5, 0.5);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--negro);color:#FFF;font-family:'Exo 2', sans-serif;overflow-x:hidden;
    background: radial-gradient(ellipse at center, #0F0F0F 0%, #000 100%);
  }
  /* PARTICULAS DE FONDO */
  #particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1}

  header{
    height:450px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;
    background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%), url('https://files.evogb.win/2gepcp.jpg') center/cover fixed;
    border-bottom:4px solid var(--naranja);box-shadow:0 0 100px var(--naranja);position:relative;
  }
  header::after{
    content:'';position:absolute;bottom:0;left:0;width:100%;height:3px;
    background:linear-gradient(90deg, transparent, var(--naranja), transparent);
    animation:scanLine 2s linear infinite;
  }
  @keyframes scanLine{0%{transform:translateX(-100%)} 100%{transform:translateX(100%)}}
.logo{
    width:180px;height:180px;border-radius:50%;border:5px solid var(--naranja);
    box-shadow:0 0 50px var(--naranja), 0 0 100px rgba(255,123,0,0.6);
    margin-bottom:25px;object-fit:cover;animation:float 3s ease-in-out infinite;z-index:2;
  }
  @keyframes float{0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)}}
  h1{
    font-family:'Zen Dots', cursive;color:var(--naranja-glow);font-size:4.2rem;
    text-shadow:0 0 20px var(--naranja), 0 0 40px var(--naranja);letter-spacing:8px;z-index:2;
  }
  header span{color:#ccc;margin-top:12px;font-size:1.3rem;letter-spacing:8px;font-weight:700;z-index:2}

.selector-pais{text-align:center;padding:35px;background:var(--vidrio);backdrop-filter:blur(25px);border-bottom:2px solid var(--naranja)}
.selector-pais p{font-size:22px;font-weight:900;color:var(--naranja);margin-bottom:20px;letter-spacing:3px}
.selector-pais button{margin:10px;padding:14px 25px;background:rgba(255,123,0,0.1);border:2px solid var(--naranja);color:var(--naranja);border-radius:15px;cursor:pointer;font-weight:800;font-size:17px;transition:0.4s;position:relative;overflow:hidden}
.selector-pais button::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg, transparent, rgba(255,123,0,0.4), transparent);transition:0.5s}
.selector-pais button:hover::before{left:100%}
.selector-pais button:hover,.selector-pais button.active{background:var(--naranja);color:#000;box-shadow:0 0 40px var(--naranja);transform:scale(1.1)}

.tabs-categorias{display:flex;justify-content:center;gap:25px;margin:50px 0 30px;flex-wrap:wrap}
.tab-cat{padding:18px 40px;background:var(--vidrio);border:2px solid #222;color:#888;border-radius:20px;cursor:pointer;font-weight:800;font-size:19px;transition:0.5s;backdrop-filter:blur(15px);letter-spacing:2px;position:relative}
.tab-cat.active{border-color:var(--naranja);color:var(--naranja);box-shadow:0 0 30px var(--naranja);background:rgba(255,123,0,0.2)}
.tab-cat.active::after{content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:60%;height:3px;background:var(--naranja);box-shadow:0 0 10px var(--naranja)}

.categoria{padding:0 6%;display:none}
.categoria.active{display:block;animation:fadeInScale 0.8s}
  @keyframes fadeInScale{from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)}}
.productos{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:35px}
.card{
    background:var(--vidrio);backdrop-filter:blur(25px);
    border:1px solid rgba(255,123,0,0.5);border-radius:30px;padding:30px;text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,0.8);transition:0.6s;position:relative;
    transform-style:preserve-3d;perspective:1000px;
  }
.card:hover{transform:translateY(-15px) rotateX(5deg);border-color:var(--naranja);box-shadow:0 0 60px var(--naranja)}
.card h3{font-family:'Zen Dots', cursive;color:var(--naranja-glow);margin-bottom:12px;font-size:1.4rem;letter-spacing:2px}
.card.nota{font-size:14px;color:#aaa;margin-bottom:18px;min-height:45px;font-weight:700}
.card.precio{font-family:'Zen Dots', cursive;font-size:2.8rem;color:#fff;margin:18px 0;text-shadow:0 0 20px var(--naranja)}
.card button{
    background:linear-gradient(135deg, var(--naranja) 0%, var(--naranja-glow) 100%);
    border:none;color:#000;padding:15px 30px;border-radius:15px;margin:8px;cursor:pointer;
    font-weight:900;font-size:17px;transition:0.4s;letter-spacing:1px;position:relative;overflow:hidden
  }
.card button::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);transition:0.5s}
.card button:hover::before{left:100%}
.card button:hover{transform:scale(1.1);box-shadow:0 0 30px var(--naranja)}

  #btn-carrito{
    position:fixed;top:35px;right:35px;background:linear-gradient(135deg, var(--naranja) 0%, var(--naranja-glow) 100%);
    color:#000;padding:18px 28px;border:none;border-radius:50px;font-weight:900;cursor:pointer;
    z-index:1000;box-shadow:0 0 40px var(--naranja);font-size:18px;transition:0.3s
  }
  #btn-carrito:hover{transform:scale(1.1) rotate(5deg)}
  #carrito{
    position:fixed;right:-420px;top:0;background:rgba(10,10,10,0.95);width:420px;height:100%;
    padding:35px;border-left:4px solid var(--naranja);transition:0.7s;overflow-y:auto;z-index:999;backdrop-filter:blur(20px)
  }
  #carrito.open{right:0}

.audio-btn{
    position:fixed;bottom:35px;left:35px;width:75px;height:75px;background:radial-gradient(circle, var(--naranja-glow) 0%, var(--naranja) 100%);
    color:#000;border:none;border-radius:50%;cursor:pointer;box-shadow:0 0 50px var(--naranja);
    display:flex;align-items:center;justify-content:center;font-size:32px;transition:0.5s;z-index:1001;
  }
.audio-btn:hover{transform:scale(1.3) rotate(360deg)}
.audio-btn.playing{animation:neonPulse 1.5s infinite}
  @keyframes neonPulse{0%,100%{box-shadow:0 0 50px var(--naranja)} 50%{box-shadow:0 0 80px var(--naranja-glow)}}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<header>
  <img src="https://files.evogb.win/2gepcp.jpg" class="logo" alt="Garfield Store">
  <h1>GARFIELD STORE</h1>
  <span>CYBER ELITE SYSTEM</span>
</header>

<button id="btn-carrito">🛒 <span id="cant-carrito">0</span></button>
<audio id="musica" src="garfield.mp3" loop></audio>
<button class="audio-btn" id="btnMusica" onclick="toggleMusica()">🔊</button>

<div class="selector-pais">
  <p>SELECCIONA TU REGIÓN</p>
  <div id="paises"></div>
</div>

<div class="tabs-categorias" id="tabs"></div>
<div id="contenedor-categorias"></div>

<div id="carrito">
  <h2 style="color:var(--naranja);font-family:Zen Dots;font-size:2rem">CARRITO</h2>
  <div id="items-carrito"></div>
  <p style="margin-top:25px;font-size:1.8rem;font-weight:900">TOTAL: <span id="total" style="color:var(--naranja);font-family:Zen Dots">0</span></p>
  <h3 style="color:var(--naranja);margin-top:30px;font-weight:900">MÉTODO DE PAGO</h3>
  <div id="metodos-pago"></div>
  <button onclick="comprarWhatsApp()" style="width:100%;margin-top:30px;background:#25D366;color:#fff;padding:18px;border:none;border-radius:15px;font-weight:900;cursor:pointer;font-size:18px">ENVIAR PEDIDO A WHATSAPP</button>
  <button onclick="toggleCarrito()" style="width:100%;margin-top:15px;background:#222;color:#fff;padding:15px;border:none;border-radius:15px;cursor:pointer;font-weight:900">CERRAR</button>
</div>

<script>
/* PARTICULAS */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let particles = [];
for(let i=0; i<80; i++){ particles.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*2, dx:(Math.random()-0.5)*0.5, dy:(Math.random()-0.5)*0.5}) }
function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = 'rgba(255,123,0,0.5)';
  particles.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    p.x+=p.dx; p.y+=p.dy;
    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

let data = {};
let paisActual = "PE";
let carritoItems = {};
let musicaOn = false;
let categoriaActiva = "DIAMANTES";

fetch('data.json').then(res => res.json()).then(d => { data = d; renderPaises(); renderTabs(); renderTodo(); });

function renderPaises(){
  document.getElementById('paises').innerHTML = Object.keys(data.paises).map(p => `
    <button class="${paisActual==p?'active':''}" onclick="cambiarPais('${p}')">${data.paises[p].bandera} ${data.paises[p].nombre}</button>
  `).join('');
}
function cambiarPais(p){ paisActual = p; renderPaises(); renderTodo(); renderMetodosPago(); renderCarrito(); }

function renderTabs(){
  let tabs = ["DIAMANTES", "SEGUIDORES", "SERVICIOS", "DESIGN"];
  document.getElementById('tabs').innerHTML = tabs.map(t=>`<div class="tab-cat ${categoriaActiva==t?'active':''}" onclick="cambiarTab('${t}')">${t}</div>`).join('');
}
function cambiarTab(tab){ categoriaActiva = tab; renderTabs(); renderTodo(); }

function renderTodo(){
  let categorias = {
    "DIAMANTES": data.productos.filter(p=>p.id.includes('diamantes')),
    "SEGUIDORES": data.productos.filter(p=>p.id.includes('seguidores')),
    "SERVICIOS": data.productos.filter(p=>['numeros_virtuales','combo_decana','spam_3d','spam_5d','spam_7d'].includes(p.id)),
    "DESIGN": data.productos.filter(p=>p.id.includes('design'))
  };
  let html = '';
  for(let cat in categorias){
    let prods = categorias[cat].filter(prod => prod.disponible_en.includes(paisActual));
    if(prods.length > 0){
      html += `<div class="categoria ${categoriaActiva==cat?'active':''}"><div class="productos">`;
      html += prods.map(prod => {
        let precio = prod.precios[paisActual];
        let moneda = data.paises[paisActual].moneda;
        return `<div class="card"><h3>${prod.nombre}</h3><p class="nota">${prod.nota || ''}</p><p class="precio">${moneda}${precio}</p><button onclick="addCarrito('${prod.id}')">+ AÑADIR</button></div>`;
      }).join('');
      html += `</div></div>`;
    }
  }
  document.getElementById('contenedor-categorias').innerHTML = html;
}

function addCarrito(id){ carritoItems[id] = (carritoItems[id] || 0) + 1; renderCarrito(); }
function renderCarrito(){
  let items = Object.keys(carritoItems).map(id => {
    let prod = data.productos.find(p=>p.id==id);
    return `<div style="border-bottom:1px solid #222;padding:14px 0;display:flex;justify-content:space-between;font-size:16px;font-weight:700">${prod.nombre} <b style="color:var(--naranja)">x${carritoItems[id]}</b></div>`
  }).join('');
  document.getElementById('items-carrito').innerHTML = items || '<p style="color:#555;text-align:center;margin-top:40px">CARRITO VACÍO</p>';
  let total = Object.keys(carritoItems).reduce((t,id)=>{ let prod = data.productos.find(p=>p.id==id); return t + prod.precios[paisActual] * carritoItems[id]; },0);
  document.getElementById('total').innerText = data.paises[paisActual].moneda + total;
  document.getElementById('cant-carrito').innerText = Object.values(carritoItems).reduce((a,b)=>a+b,0);
}
function renderMetodosPago(){
  let pagos = data.paises[paisActual].pagos;
  document.getElementById('metodos-pago').innerHTML = pagos.map(p=>`<label style="display:block;margin:14px 0;background:#0A0A0A;padding:14px;border-radius:12px;border:1px solid #333;font-weight:800"><input type="radio" name="pago" value="${p}"> ${p}</label>`).join('');
}
function comprarWhatsApp(){
  let pago = document.querySelector('input[name="pago"]:checked')?.value || 'No especificado';
  let msg = `Hola Garfield Store!%0A[CYBER ELITE]%0APaís: ${data.paises[paisActual].nombre}%0AMétodo: ${pago}%0A%0AProductos:%0A`;
  Object.keys(carritoItems).forEach(id=>{let prod = data.productos.find(p=>p.id==id);msg += `${carritoItems[id]}x ${prod.nombre}%0A`;});
  msg += `%0ATOTAL: ${document.getElementById('total').innerText}`;
  window.open(`https://wa.me/51920726588?text=${msg}`);
}
function toggleCarrito(){ document.getElementById('carrito').classList.toggle('open'); }
document.getElementById('btn-carrito').onclick = toggleCarrito;
function toggleMusica(){
  let m=document.getElementById('musica'); let btn=document.getElementById('btnMusica');
  if(musicaOn){m.pause(); btn.classList.remove('playing'); btn.innerText='🔇'}
  else{m.play(); btn.classList.add('playing'); btn.innerText='🔊'}
  musicaOn=!musicaOn;
}
window.addEventListener('resize', ()=>{canvas.width=window.innerWidth; canvas.height=window.innerHeight});
</script>
</body>
</html>
