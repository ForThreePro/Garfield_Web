<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garfield Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-grid"></div>

    <nav class="navbar">
        <button class="menu-btn" id="menu-btn">☰</button>
        <div class="nav-brand">🐱 GARFIELD STORE</div>
        <button class="cart-btn" id="cart-btn">🛒<span id="cart-count">0</span></button>
    </nav>

    <div class="sidebar" id="sidebar">
        <button class="close-btn" id="close-btn">✖</button>
        <h3>MENÚ</h3>
        <a href="#" class="nav-link" data-target="inicio">🏠 INICIO</a>
        <a href="#" class="nav-link" data-target="tienda">🛒 TIENDA</a>
        <a href="https://wa.me/51927174369" target="_blank">💬 WHATSAPP</a>
        <a href="#" id="ver-carrito">🧡 VER CARRITO</a>
    </div>
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <!-- INICIO -->
        <section class="main-section active" id="inicio">
            <div class="inicio-logo">
                <img src="logo.png" alt="Garfield Store">
                <h1 class="logo">GARFIELD STORE</h1>
                <p class="subtitle">Diamantes & Servicios Premium 🍝</p>
                <p class="version">⭐ +2000 RECARGAS | ODIO LOS LUNES</p>
                <a href="#" class="cta-btn" data-target="tienda">🛒 IR A LA TIENDA</a>
                <div class="info-box">
                    <strong>Horario:</strong> Mañanas y Noches<br>
                    <strong>Pago:</strong> Yape | Global66 | Prex
                </div>
            </div>
        </section>

        <!-- TIENDA ESTILO ARCADIA -->
        <section class="main-section" id="tienda">
            <h1 class="section-title">🛒 TIENDA</h1>

            <input type="text" class="search-box" id="search" placeholder="🔍 Buscar producto...">

            <div class="category-tabs">
                <button class="tab-btn active" data-filter="todos">Todos</button>
                <button class="tab-btn" data-filter="diseño">Diseño</button>
                <button class="tab-btn" data-filter="servicio">Servicios</button>
                <button class="tab-btn" data-filter="redes">Redes</button>
                <button class="tab-btn" data-filter="diamantes">Diamantes</button>
            </div>

            <!-- DIAMANTES -->
            <div class="section-block" data-category="diamantes">
                <div class="section-header">
                    <div class="section-label">CATÁLOGO</div>
                    <h2>💎 DIAMANTES</h2>
                </div>
                <div class="country-tabs">
                    <button class="country-btn active" data-country="pe">🇵🇪 PE</button>
                    <button class="country-btn" data-country="cl">🇨🇱 CL</button>
                    <button class="country-btn" data-country="ar">🇦🇷 AR</button>
                    <button class="country-btn" data-country="mx">🇲🇽 MX</button>
                    <button class="country-btn" data-country="bo">🇧🇴 BO</button>
                    <button class="country-btn" data-country="uy">🇺🇾 UY</button>
                </div>
                <div id="precios-container"></div>
            </div>

            <!-- PRODUCTOS -->
            <div id="tienda-grid"></div>
        </section>
    </div>

    <!-- MODAL PRODUCTO -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">✖</button>
            <div class="product-logo" id="modal-icon"></div>
            <h3 id="modal-title"></h3>
            <p id="modal-desc"></p>
            <p id="modal-price"></p>
            <button class="btn-add" id="btn-add-cart">AÑADIR AL CARRITO</button>
        </div>
    </div>

    <!-- MODAL CARRITO -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-cart">✖</button>
            <h3>🧡 TU CARRITO</h3>
            <div id="cart-items"></div>
            <p id="cart-total"></p>
            <a href="#" class="btn-add" id="btn-checkout">PEDIR POR WHATSAPP</a>
        </div>
    </div>

    <script src="productos.js"></script>
    <script src="monedas.js"></script>
    <script src="tienda.js"></script>
    <script src="script.js"></script>
</body>
</html>
