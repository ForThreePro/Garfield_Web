<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARFIELD STORE | PANEL GAMER</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --naranja: #FF4500;
    --naranja-brillante: #FF6A00;
    --negro: #0A0A0A;
    --negro-claro: #111;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron', sans-serif}
  body{background:var(--negro);color:#fff;overflow-x:hidden}
  body::before{
    content:'';position:fixed;top:0;left:0;width:100%;height:100%;
    background: linear-gradient(135deg, #FF4500 0%, transparent 70%);
    opacity:0.08;z-index:-1;
  }
  header{
    height:280px;
    background: url('banner-garfield.jpg') center/cover, linear-gradient(90deg, var(--negro) 0%, var(--naranja) 50%, var(--negro) 100%);
    border-bottom:4px solid var(--naranja);
    box-shadow: 0 0 30px var(--naranja);
    position:relative;
  }
  header::after{
    content:'MANTENIMIENTO ACTIVO 24/7';
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    background:var(--naranja);color:#000;padding:5px 20px;border-radius:20px;
    font-weight:900;font-size:12px;letter-spacing:2px;
  }
  h1{
    text-align:center;color:var(--naranja-brillante);font-size:2.8rem;padding:20px;
    text-shadow:0 0 10px var(--naranja), 0 0 20px var(--naranja);
    font-weight:900;
  }
.selector-pais{text-align:center;padding:20px;background:var(--negro-claro);border-bottom:2px solid var(--naranja)}
.selector-pais button{
    margin:6px;padding:10px 16px;background:#000;border:2px solid var(--naranja);
    color:var(--naranja);border-radius:8px;cursor:pointer;font-weight:700;
    transition:0.2s;box-shadow:0 0 5px transparent;
  }
.selector-pais button:hover{background:var(--naranja);color:#000;box-shadow:0 0 15px var(--naranja)}
.selector-pais button.active{background:var(--naranja);color:#000;box-shadow:0 0 20px var(--naranja)}
.productos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;padding:25px}
.card{
    background:linear-gradient(180deg, #1A1A1A 0%, #0A0A0A 100%);
    border:2px solid var(--naranja);border-radius:15px;padding:18px;text-align:center;
    box-shadow:0 0 15px rgba(255,69,0,0.3);transition:0.3s;
  }
.card:hover{transform:translateY(-5px);box-shadow:0 0 30px var(--naranja)}
.card h3{color:var(--naranja-brillante);margin-bottom:10px;font-weight:700}
.card.nota{font-size:11px;color:#aaa;margin-bottom:8px}
.card.precio{font-size:1.6rem;color:#fff;margin:10px 0;text-shadow:0 0 8px var(--naranja)}
.card button{
    background:var(--naranja);border:none;color:#000;padding:10px 15px;border-radius:8px;
    margin:5px;cursor:pointer;font-weight:900;transition:0.2s;
  }
.card button:hover{background:var(--naranja-brillante);box-shadow:0 0 15px var(--naranja)}
  #btn-carrito{
    position:fixed;top:20px;right:20px;background:var(--naranja);color:#000;
    padding:12px 18px;border:none;border-radius:50px;font-weight:900;cursor:pointer;
    z-index:1000;box-shadow:0 0 20px var(--naranja);font-size:16px;
  }
  #carrito{
    position:fixed;right:-350px;top:0;background:var(--negro-claro);width:350px;height:100%;
    padding:20px;border-left:3px solid var(--naranja);transition:0.4s;overflow-y:auto;z-index:999;
    box-shadow:-10px 0 30px rgba(255,69,0,0.5);
  }
  #carrito.open{right:0}
  #carrito h2{color:var(--naranja);text-shadow:0 0 10px var(--naranja)}
 .audio-btn{
    position:fixed;bottom:20px;left:20px;background:var(--naranja);color:#000;
    border:none;padding:12px;border-radius:50%;cursor:pointer;box-shadow:0 0 15px var(--naranja)
  }
</style>
</head>
<body>
<header></header>
<button id="btn-carrito">🛒 <span id="cant-carrito">0</span></button>
<audio id="musica" src="garfield.mp3" loop></audio>
<button class="audio-btn" onclick="toggleMusica()">🔊</button>

<h1>GARFIELD STORE</h1>

<div class="selector-pais">
  <p style="margin-bottom:12px;color:var(--naranja)">SELECCIONA TU REGIÓN</p>
  <div id="paises"></div>
</div>

<div class="productos" id="productos"></div>

<div id="carrito">
  <h2>CARRITO GAMER</h2>
  <div id="items-carrito"></div>
  <p style="margin-top:10px;font-size:1.2rem">TOTAL: <span id="total" style="color:var(--naranja)">0</span></p>

  <h3 style="color:var(--naranja);margin-top:15px">MÉTODO DE PAGO</h3>
  <div id="metodos-pago"></div>

  <button onclick="comprarWhatsApp()" style="width:100%;margin-top:15px;background:#25D366;color:#fff;padding:14px;border:none;border-radius:8px;font-weight:900;cursor:pointer;box-shadow:0 0 15px #25D366">COMPRAR POR WHATSAPP</button>
  <button onclick="toggleCarrito()" style="width:100%;margin-top:8px;background:#333;color:#fff;padding:10px;border:none;border-radius:8px;cursor:pointer">CERRAR</button>
</div>

<script>
let data = {};
let paisActual = "PE";
let carritoItems = {};
let musicaOn = false;

fetch('data.json')
.then(res => res.json())
.then(d => { data = d; renderPaises(); renderProductos(); renderMetodosPago(); });

function renderPaises(){
  document.getElementById('paises').innerHTML = Object.keys(data.paises).map(p => `
    <button class="${paisActual==p?'active':''}" onclick="cambiarPais('${p}')">${data.paises[p].bandera} ${data.paises[p].nombre}</button>
  `).join('');
}

function cambiarPais(p){
  paisActual = p;
  renderPaises();
  renderProductos();
  renderMetodosPago();
  renderCarrito();
}

function renderProductos(){
  let productosFiltrados = data.productos.filter(prod => prod.disponible_en.includes(paisActual));
  document.getElementById('productos').innerHTML = productosFiltrados.map(prod => {
    let precio = prod.precios[paisActual];
    let moneda = data.paises[paisActual].moneda;
    return `
    <div class="card">
      <h3>${prod.nombre}</h3>
      <p class="nota">${prod.nota || ''}</p>
      <p class="precio">${moneda}${precio}</p>
      <button onclick="verProducto('${prod.nombre}')">VER INFO</button>
      <button onclick="addCarrito('${prod.id}')">+ AÑADIR</button>
    </div>
    `
  }).join('');
}

function addCarrito(id){
  carritoItems[id] = (carritoItems[id] || 0) + 1;
  renderCarrito();
}

function renderCarrito(){
  let items = Object.keys(carritoItems).map(id => {
    let prod = data.productos.find(p=>p.id==id);
    return `<div style="border-bottom:1px solid #333;padding:8px 0">
      ${prod.nombre} x${carritoItems[id]}
      <button onclick="carritoItems[id]--;if(carritoItems[id]<=0)delete carritoItems[id];renderCarrito()">-</button>
      <button onclick="carritoItems[id]++;renderCarrito()">+</button>
    </div>`
  }).join('');
  document.getElementById('items-carrito').innerHTML = items || '<p style="color:#555">CARRITO VACÍO</p>';
  let total = Object.keys(carritoItems).reduce((t,id)=>{
    let prod = data.productos.find(p=>p.id==id);
    return t + prod.precios[paisActual] * carritoItems[id];
  },0);
  document.getElementById('total').innerText = data.paises[paisActual].moneda + total;
  document.getElementById('cant-carrito').innerText = Object.values(carritoItems).reduce((a,b)=>a+b,0);
}

function renderMetodosPago(){
  let pagos = data.paises[paisActual].pagos;
  document.getElementById('metodos-pago').innerHTML = pagos.map(p=>`
    <label style="display:block;margin:8px 0"><input type="radio" name="pago" value="${p}"> ${p}</label>
  `).join('');
}

function comprarWhatsApp(){
  let pago = document.querySelector('input[name="pago"]:checked')?.value || 'No especificado';
  let msg = `Hola Garfield Store!%0A[PANEL GAMER]%0APaís: ${data.paises[paisActual].nombre}%0AMétodo: ${pago}%0A%0AProductos:%0A`;
  Object.keys(carritoItems).forEach(id=>{
    let prod = data.productos.find(p=>p.id==id);
    msg += `${carritoItems[id]}x ${prod.nombre}%0A`;
  });
  msg += `%0ATOTAL: ${document.getElementById('total').innerText}`;
  window.open(`https://wa.me/51920726588?text=${msg}`);
}

function toggleCarrito(){ document.getElementById('carrito').classList.toggle('open'); }
document.getElementById('btn-carrito').onclick = toggleCarrito;
function toggleMusica(){ let m=document.getElementById('musica'); musicaOn?!m.pause():m.play(); musicaOn=!musicaOn; }
function verProducto(nombre){ alert('INFO: '+nombre+'\n\nContáctanos para más detalles'); }
</script>
</body>
</html>
