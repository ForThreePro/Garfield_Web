<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garfield Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-gradient"></div>

    <nav class="navbar">
        <button class="menu-btn" id="menu-btn">☰</button>
        <div class="nav-brand">🐱 GARFIELD <span>STORE</span></div>
        <button class="cart-btn" id="cart-btn">🛒<span id="cart-count">0</span></button>
    </nav>

    <div class="sidebar" id="sidebar">
        <button class="close-btn" id="close-btn">✖</button>
        <h3>MENÚ</h3>
        <a href="#" class="nav-link" data-target="inicio">🏠 INICIO</a>
        <a href="#" class="nav-link active" data-target="tienda">🛒 TIENDA</a>
        <a href="https://wa.me/51927174369" target="_blank">💬 WHATSAPP</a>
        <a href="#" id="ver-carrito">🧡 CARRITO</a>
    </div>
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <!-- INICIO SIMPLE -->
        <section class="main-section" id="inicio">
            <div class="hero-simple">
                <img src="logo.png" alt="Garfield">
                <h1>GARFIELD <span>STORE</span></h1>
                <p>Diamantes y Servicios Premium</p>
                <a href="#" class="btn-main" data-target="tienda">IR A LA TIENDA</a>
            </div>
        </section>

        <!-- TIENDA NUEVA 100% -->
        <section class="main-section active" id="tienda">
            <div class="tienda-top">
                <h1>🛒 TIENDA</h1>
                <input type="text" id="search" placeholder="🔍 Buscar producto...">
            </div>

            <!-- FILTROS STICKY -->
            <div class="filters-sticky">
                <div class="filter-group">
                    <span>Categoría:</span>
                    <div class="category-tabs">
                        <button class="tab-btn active" data-filter="todos">Todos</button>
                        <button class="tab-btn" data-filter="diamantes">💎 Diamantes</button>
                        <button class="tab-btn" data-filter="diseño">🎨 Diseño</button>
                        <button class="tab-btn" data-filter="servicio">⚡ Servicios</button>
                        <button class="tab-btn" data-filter="redes">📱 Redes</button>
                    </div>
                </div>
                <div class="filter-group">
                    <span>País:</span>
                    <div class="country-tabs">
                        <button class="country-btn active" data-country="pe">🇵🇪 PE</button>
                        <button class="country-btn" data-country="cl">🇨🇱 CL</button>
                        <button class="country-btn" data-country="ar">🇦🇷 AR</button>
                        <button class="country-btn" data-country="mx">🇲🇽 MX</button>
                        <button class="country-btn" data-country="bo">🇧🇴 BO</button>
                        <button class="country-btn" data-country="uy">🇺🇾 UY</button>
                    </div>
                </div>
            </div>

            <div id="tienda-grid"></div>
        </section>
    </div>

    <!-- MODAL PRODUCTO -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal">✖</button>
            <div class="modal-icon" id="modal-icon"></div>
            <h3 id="modal-title"></h3>
            <p id="modal-desc"></p>
            <div class="modal-price" id="modal-price"></div>
            <button class="btn-main" id="btn-add-cart">AÑADIR AL CARRITO</button>
        </div>
    </div>

    <!-- MODAL CARRITO -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-cart">✖</button>
            <h3>🧡 TU CARRITO</h3>
            <div id="cart-items"></div>
            <div id="cart-total"></div>
            <button class="btn-main" id="btn-checkout">PEDIR POR WHATSAPP</button>
        </div>
    </div>

    <script src="productos.js"></script>
    <script src="monedas.js"></script>
    <script src="tienda.js"></script>
    <script src="script.js"></script>
</body>
</html>
