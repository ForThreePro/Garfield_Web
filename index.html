<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARFIELD STORE | ELITE PANEL</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;600;800&family=Audiowide&display=swap" rel="stylesheet">
<style>
  :root{
    --naranja: #FF6B00;
    --naranja-glow: #FF9D00;
    --negro: #020202;
    --negro-claro: #0A0A0A;
    --vidrio: rgba(10, 10, 10, 0.6);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--negro);color:#F0F0F0;font-family:'Saira Condensed', sans-serif;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,107,0,0.15) 0%, transparent 30%),
      radial-gradient(circle at 90% 80%, rgba(255,157,0,0.1) 0%, transparent 30%),
      linear-gradient(#0A0A0A 1px, transparent 1px), linear-gradient(90deg, #0A0A0A 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
  }

  header{
    height:400px;
    background: linear-gradient(180deg, rgba(2,2,2,0.3) 0%, rgba(2,2,2,0.95) 100%), url('https://files.evogb.win/2gepcp.jpg') center/cover fixed;
    border-bottom:4px solid var(--naranja);
    box-shadow: 0 0 80px var(--naranja);
    display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;
    position:relative;overflow:hidden;
  }
  header::before{
    content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg, transparent, rgba(255,157,0,0.2), transparent);
    animation:scan 3s infinite;
  }
  @keyframes scan{0%{left:-100%} 100%{left:100%}}
.logo{
    width:160px;height:160px;border-radius:50%;border:5px solid var(--naranja);
    box-shadow:0 0 40px var(--naranja), 0 0 80px rgba(255,107,0,0.5);
    margin-bottom:20px;object-fit:cover;z-index:2;
  }
  h1{
    font-family:'Audiowide', cursive;color:var(--naranja-glow);font-size:3.8rem;
    text-shadow:0 0 10px var(--naranja), 0 0 30px var(--naranja), 0 0 50px var(--naranja);
    font-weight:400;letter-spacing:5px;z-index:2;
  }
  header span{color:#bbb;margin-top:10px;font-size:1.2rem;letter-spacing:6px;font-weight:600;z-index:2}

.selector-pais{text-align:center;padding:30px;background:var(--vidrio);backdrop-filter:blur(20px);border-bottom:2px solid var(--naranja)}
.selector-pais p{font-size:20px;font-weight:800;color:var(--naranja);margin-bottom:15px;letter-spacing:2px}
.selector-pais button{margin:8px;padding:12px 22px;background:rgba(0,0,0,0.6);border:2px solid var(--naranja);color:var(--naranja);border-radius:12px;cursor:pointer;font-weight:800;font-size:16px;transition:0.3s;font-family:'Saira Condensed', sans-serif}
.selector-pais button:hover,.selector-pais button.active{background:var(--naranja);color:#000;box-shadow:0 0 30px var(--naranja);transform:translateY(-3px)}

.tabs-categorias{display:flex;justify-content:center;gap:20px;margin:40px 0 25px;flex-wrap:wrap}
.tab-cat{padding:15px 35px;background:var(--vidrio);border:2px solid #222;color:#888;border-radius:15px;cursor:pointer;font-weight:800;font-size:18px;transition:0.4s;backdrop-filter:blur(10px);font-family:'Saira Condensed', sans-serif;letter-spacing:1px}
.tab-cat.active,.tab-cat:hover{border-color:var(--naranja);color:var(--naranja);box-shadow:0 0 25px var(--naranja);background:rgba(255,107,0,0.15);transform:translateY(-5px)}

.categoria{padding:0 5%;display:none}
.categoria.active{display:block;animation:fadeInUp 0.6s}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)}}
.productos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px}
.card{
    background:var(--vidrio);backdrop-filter:blur(20px);
    border:1px solid rgba(255,107,0,0.4);border-radius:25px;padding:25px;text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.7);transition:0.5s;position:relative;overflow:hidden;
  }
.card::after{content:'';position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg, transparent, var(--naranja), transparent)}
.card:hover{transform:translateY(-12px) scale(1.03);border-color:var(--naranja);box-shadow:0 0 50px var(--naranja)}
.card h3{font-family:'Audiowide', cursive;color:var(--naranja-glow);margin-bottom:10px;font-weight:400;font-size:1.3rem;letter-spacing:1px}
.card.nota{font-size:13px;color:#aaa;margin-bottom:15px;min-height:40px;font-weight:600}
.card.precio{font-family:'Audiowide', cursive;font-size:2.4rem;color:#fff;margin:15px 0;text-shadow:0 0 15px var(--naranja)}
.card button{
    background:linear-gradient(90deg, var(--naranja) 0%, var(--naranja-glow) 100%);
    border:none;color:#000;padding:14px 25px;border-radius:12px;margin:5px;cursor:pointer;
    font-weight:800;font-size:16px;transition:0.3s;font-family:'Saira Condensed', sans-serif;letter-spacing:1px
  }
.card button:hover{transform:scale(1.08);box-shadow:0 0 25px var(--naranja)}

  #btn-carrito{
    position:fixed;top:30px;right:30px;background:linear-gradient(90deg, var(--naranja) 0%, var(--naranja-glow) 100%);
    color:#000;padding:16px 24px;border:none;border-radius:50px;font-weight:800;cursor:pointer;
    z-index:1000;box-shadow:0 0 30px var(--naranja);font-size:17px;font-family:'Saira Condensed', sans-serif
  }
  #carrito{
    position:fixed;right:-400px;top:0;background:var(--negro-claro);width:400px;height:100%;
    padding:30px;border-left:4px solid var(--naranja);transition:0.6s;overflow-y:auto;z-index:999;backdrop-filter:blur(15px)
  }
  #carrito.open{right:0}

.audio-btn{
    position:fixed;bottom:30px;left:30px;width:70px;height:70px;background:radial-gradient(circle, var(--naranja-glow) 0%, var(--naranja) 100%);
    color:#000;border:none;border-radius:50%;cursor:pointer;box-shadow:0 0 40px var(--naranja);
    display:flex;align-items:center;justify-content:center;font-size:28px;transition:0.4s;z-index:1001;
  }
.audio-btn:hover{transform:scale(1.2) rotate(15deg)}
.audio-btn.playing::after{content:'';position:absolute;width:100%;height:100%;border:4px solid var(--naranja);border-radius:50%;animation:sonar 1.2s infinite}
  @keyframes sonar{0%{transform:scale(1);opacity:1} 100%{transform:scale(2);opacity:0}}
</style>
</head>
<body>
<header>
  <img src="https://files.evogb.win/2gepcp.jpg" class="logo" alt="Garfield Store">
  <h1>GARFIELD STORE</h1>
  <span>SISTEMA ELITE 24/7</span>
</header>

<button id="btn-carrito">🛒 <span id="cant-carrito">0</span></button>
<audio id="musica" src="garfield.mp3" loop></audio>
<button class="audio-btn" id="btnMusica" onclick="toggleMusica()">🔊</button>

<div class="selector-pais">
  <p>SELECCIONA TU REGIÓN</p>
  <div id="paises"></div>
</div>

<div class="tabs-categorias" id="tabs"></div>
<div id="contenedor-categorias"></div>

<div id="carrito">
  <h2 style="color:var(--naranja);font-family:Audiowide;font-size:1.8rem">CARRITO</h2>
  <div id="items-carrito"></div>
  <p style="margin-top:20px;font-size:1.6rem;font-weight:800">TOTAL: <span id="total" style="color:var(--naranja);font-family:Audiowide">0</span></p>
  <h3 style="color:var(--naranja);margin-top:25px;font-weight:800">MÉTODO DE PAGO</h3>
  <div id="metodos-pago"></div>
  <button onclick="comprarWhatsApp()" style="width:100%;margin-top:25px;background:#25D366;color:#fff;padding:16px;border:none;border-radius:12px;font-weight:800;cursor:pointer;font-size:17px;font-family:Saira Condensed">ENVIAR PEDIDO A WHATSAPP</button>
  <button onclick="toggleCarrito()" style="width:100%;margin-top:12px;background:#222;color:#fff;padding:14px;border:none;border-radius:12px;cursor:pointer;font-weight:800">CERRAR</button>
</div>

<script>
let data = {};
let paisActual = "PE";
let carritoItems = {};
let musicaOn = false;
let categoriaActiva = "DIAMANTES";

fetch('data.json')
.then(res => res.json())
.then(d => { data = d; renderPaises(); renderTabs(); renderTodo(); });

function renderPaises(){
  document.getElementById('paises').innerHTML = Object.keys(data.paises).map(p => `
    <button class="${paisActual==p?'active':''}" onclick="cambiarPais('${p}')">${data.paises[p].bandera} ${data.paises[p].nombre}</button>
  `).join('');
}

function cambiarPais(p){
  paisActual = p;
  renderPaises();
  renderTodo();
  renderMetodosPago();
  renderCarrito();
}

function renderTabs(){
  let tabs = ["DIAMANTES", "SEGUIDORES", "SERVICIOS", "DESIGN"];
  document.getElementById('tabs').innerHTML = tabs.map(t=>`<div class="tab-cat ${categoriaActiva==t?'active':''}" onclick="cambiarTab('${t}')">${t}</div>`).join('');
}

function cambiarTab(tab){
  categoriaActiva = tab;
  renderTabs();
  renderTodo();
}

function renderTodo(){
  let categorias = {
    "DIAMANTES": data.productos.filter(p=>p.id.includes('diamantes')),
    "SEGUIDORES": data.productos.filter(p=>p.id.includes('seguidores')),
    "SERVICIOS": data.productos.filter(p=>['numeros_virtuales','combo_decana','spam_3d','spam_5d','spam_7d'].includes(p.id)),
    "DESIGN": data.productos.filter(p=>p.id.includes('design'))
  };

  let html = '';
  for(let cat in categorias){
    let prods = categorias[cat].filter(prod => prod.disponible_en.includes(paisActual));
    if(prods.length > 0){
      html += `<div class="categoria ${categoriaActiva==cat?'active':''}"><div class="productos">`;
      html += prods.map(prod => {
        let precio = prod.precios[paisActual];
        let moneda = data.paises[paisActual].moneda;
        return `
        <div class="card">
          <h3>${prod.nombre}</h3>
          <p class="nota">${prod.nota || ''}</p>
          <p class="precio">${moneda}${precio}</p>
          <button onclick="addCarrito('${prod.id}')">+ AÑADIR</button>
        </div>`;
      }).join('');
      html += `</div></div>`;
    }
  }
  document.getElementById('contenedor-categorias').innerHTML = html;
}

function addCarrito(id){
  carritoItems[id] = (carritoItems[id] || 0) + 1;
  renderCarrito();
}

function renderCarrito(){
  let items = Object.keys(carritoItems).map(id => {
    let prod = data.productos.find(p=>p.id==id);
    return `<div style="border-bottom:1px solid #222;padding:12px 0;display:flex;justify-content:space-between;font-size:15px">${prod.nombre} <b style="color:var(--naranja)">x${carritoItems[id]}</b></div>`
  }).join('');
  document.getElementById('items-carrito').innerHTML = items || '<p style="color:#555;text-align:center;margin-top:30px">CARRITO VACÍO</p>';
  let total = Object.keys(carritoItems).reduce((t,id)=>{
    let prod = data.productos.find(p=>p.id==id);
    return t + prod.precios[paisActual] * carritoItems[id];
  },0);
  document.getElementById('total').innerText = data.paises[paisActual].moneda + total;
  document.getElementById('cant-carrito').innerText = Object.values(carritoItems).reduce((a,b)=>a+b,0);
}

function renderMetodosPago(){
  let pagos = data.paises[paisActual].pagos;
  document.getElementById('metodos-pago').innerHTML = pagos.map(p=>`<label style="display:block;margin:12px 0;background:#0F0F0F;padding:12px;border-radius:10px;border:1px solid #333;font-weight:600"><input type="radio" name="pago" value="${p}"> ${p}</label>`).join('');
}

function comprarWhatsApp(){
  let pago = document.querySelector('input[name="pago"]:checked')?.value || 'No especificado';
  let msg = `Hola Garfield Store!%0A[ELITE PANEL]%0APaís: ${data.paises[paisActual].nombre}%0AMétodo: ${pago}%0A%0AProductos:%0A`;
  Object.keys(carritoItems).forEach(id=>{let prod = data.productos.find(p=>p.id==id);msg += `${carritoItems[id]}x ${prod.nombre}%0A`;});
  msg += `%0ATOTAL: ${document.getElementById('total').innerText}`;
  window.open(`https://wa.me/51920726588?text=${msg}`);
}

function toggleCarrito(){ document.getElementById('carrito').classList.toggle('open'); }
document.getElementById('btn-carrito').onclick = toggleCarrito;

function toggleMusica(){
  let m=document.getElementById('musica');
  let btn=document.getElementById('btnMusica');
  if(musicaOn){m.pause(); btn.classList.remove('playing'); btn.innerText='🔇'}
  else{m.play(); btn.classList.add('playing'); btn.innerText='🔊'}
  musicaOn=!musicaOn;
}
</script>
</body>
</html>
