<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARFIELD STORE | PANEL PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --naranja: #FF5C00;
    --naranja-glow: #FF8A00;
    --negro: #040404;
    --negro-claro: #0D0D0D;
    --vidrio: rgba(15, 15, 15, 0.75);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Rajdhani', sans-serif}
  body{background:var(--negro);color:#E0E0E0;background-image:radial-gradient(circle at 20% 20%, rgba(255,92,0,0.15) 0%, transparent 40%), radial-gradient(circle at 80% 80%, rgba(255,92,0,0.1) 0%, transparent 40%)}

  header{
    height:350px;
    background: linear-gradient(rgba(4,4,4,0.8), rgba(4,4,4,0.95)), url('https://files.evogb.win/2gepcp.jpg') center/cover no-repeat;
    border-bottom:3px solid var(--naranja);
    box-shadow: 0 0 60px var(--naranja);
    display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;
  }
.logo{
    width:140px;height:140px;border-radius:50%;border:4px solid var(--naranja);
    box-shadow:0 0 30px var(--naranja), inset 0 0 20px rgba(255,92,0,0.3);
    margin-bottom:15px;object-fit:cover;
  }
  h1{font-family:'Orbitron', sans-serif;color:var(--naranja-glow);font-size:3rem;text-shadow:0 0 20px var(--naranja);font-weight:900;letter-spacing:3px}
  header span{color:#ccc;margin-top:8px;font-size:1.1rem;letter-spacing:4px;font-weight:500}

.selector-pais{text-align:center;padding:25px;background:var(--vidrio);backdrop-filter:blur(12px);border-bottom:2px solid var(--naranja)}
.selector-pais button{margin:6px;padding:11px 18px;background:rgba(0,0,0,0.5);border:2px solid var(--naranja);color:var(--naranja);border-radius:10px;cursor:pointer;font-weight:700;font-size:15px;transition:0.3s}
.selector-pais button:hover,.selector-pais button.active{background:var(--naranja);color:#000;box-shadow:0 0 25px var(--naranja);transform:scale(1.05)}

.tabs-categorias{display:flex;justify-content:center;gap:15px;margin:35px 0 20px;flex-wrap:wrap}
.tab-cat{padding:13px 28px;background:var(--vidrio);border:2px solid #333;color:#aaa;border-radius:12px;cursor:pointer;font-weight:700;font-size:16px;transition:0.3s;backdrop-filter:blur(5px)}
.tab-cat.active,.tab-cat:hover{border-color:var(--naranja);color:var(--naranja);box-shadow:0 0 20px var(--naranja);background:rgba(255,92,0,0.1)}

.categoria{padding:0 4%;display:none}
.categoria.active{display:block;animation:fadeIn 0.5s}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)}}
.productos{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:25px}
.card{
    background:var(--vidrio);backdrop-filter:blur(15px);
    border:1px solid rgba(255,92,0,0.3);border-radius:20px;padding:22px;text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,0.6);transition:0.4s;position:relative;
  }
.card:hover{transform:translateY(-10px) scale(1.02);border-color:var(--naranja);box-shadow:0 0 35px var(--naranja)}
.card h3{font-family:'Orbitron', sans-serif;color:var(--naranja-glow);margin-bottom:8px;font-weight:700;font-size:1.15rem}
.card.nota{font-size:12px;color:#999;margin-bottom:12px;min-height:35px}
.card.precio{font-family:'Orbitron', sans-serif;font-size:2.1rem;color:#fff;margin:12px 0;text-shadow:0 0 12px var(--naranja)}
.card button{background:linear-gradient(90deg, var(--naranja) 0%, var(--naranja-glow) 100%);border:none;color:#000;padding:12px 20px;border-radius:10px;margin:5px;cursor:pointer;font-weight:900;font-size:15px;transition:0.3s}
.card button:hover{transform:scale(1.05);box-shadow:0 0 20px var(--naranja)}

  #btn-carrito{position:fixed;top:25px;right:25px;background:linear-gradient(90deg, var(--naranja) 0%, var(--naranja-glow) 100%);color:#000;padding:14px 20px;border:none;border-radius:50px;font-weight:900;cursor:pointer;z-index:1000;box-shadow:0 0 25px var(--naranja);font-size:16px}
  #carrito{position:fixed;right:-380px;top:0;background:var(--negro-claro);width:380px;height:100%;padding:25px;border-left:3px solid var(--naranja);transition:0.5s;overflow-y:auto;z-index:999;backdrop-filter:blur(10px)}
  #carrito.open{right:0}

.audio-btn{
    position:fixed;bottom:25px;left:25px;width:65px;height:65px;background:radial-gradient(circle, var(--naranja-glow) 0%, var(--naranja) 100%);
    color:#000;border:none;border-radius:50%;cursor:pointer;box-shadow:0 0 30px var(--naranja);
    display:flex;align-items:center;justify-content:center;font-size:26px;transition:0.3s;z-index:1001;
  }
.audio-btn:hover{transform:scale(1.15)}
.audio-btn.playing::after{content:'';position:absolute;width:100%;height:100%;border:3px solid var(--naranja);border-radius:50%;animation:sonar 1.5s infinite}
  @keyframes sonar{0%{transform:scale(1);opacity:1} 100%{transform:scale(1.6);opacity:0}}
</style>
</head>
<body>
<header>
  <img src="https://files.evogb.win/2gepcp.jpg" class="logo" alt="Garfield Store">
  <h1>GARFIELD STORE</h1>
  <span>SISTEMA DE VENTAS 24/7</span>
</header>

<button id="btn-carrito">🛒 <span id="cant-carrito">0</span></button>
<audio id="musica" src="garfield.mp3" loop></audio>
<button class="audio-btn" id="btnMusica" onclick="toggleMusica()">🔊</button>

<div class="selector-pais">
  <p style="margin-bottom:15px;color:var(--naranja);font-size:18px;font-weight:700">SELECCIONA TU REGIÓN</p>
  <div id="paises"></div>
</div>

<div class="tabs-categorias" id="tabs"></div>
<div id="contenedor-categorias"></div>

<div id="carrito">
  <h2 style="color:var(--naranja);font-family:Orbitron">CARRITO</h2>
  <div id="items-carrito"></div>
  <p style="margin-top:15px;font-size:1.4rem">TOTAL: <span id="total" style="color:var(--naranja);font-family:Orbitron">0</span></p>
  <h3 style="color:var(--naranja);margin-top:20px">MÉTODO DE PAGO</h3>
  <div id="metodos-pago"></div>
  <button onclick="comprarWhatsApp()" style="width:100%;margin-top:20px;background:#25D366;color:#fff;padding:15px;border:none;border-radius:10px;font-weight:900;cursor:pointer;font-size:16px">ENVIAR PEDIDO A WHATSAPP</button>
  <button onclick="toggleCarrito()" style="width:100%;margin-top:10px;background:#222;color:#fff;padding:12px;border:none;border-radius:10px;cursor:pointer">CERRAR</button>
</div>

<script>
let data = {};
let paisActual = "PE";
let carritoItems = {};
let musicaOn = false;
let categoriaActiva = "DIAMANTES";

fetch('data.json')
.then(res => res.json())
.then(d => { data = d; renderPaises(); renderTabs(); renderTodo(); });

function renderPaises(){
  document.getElementById('paises').innerHTML = Object.keys(data.paises).map(p => `
    <button class="${paisActual==p?'active':''}" onclick="cambiarPais('${p}')">${data.paises[p].bandera} ${data.paises[p].nombre}</button>
  `).join('');
}

function cambiarPais(p){
  paisActual = p;
  renderPaises();
  renderTodo();
  renderMetodosPago();
  renderCarrito();
}

function renderTabs(){
  let tabs = ["DIAMANTES", "SEGUIDORES", "SERVICIOS", "DESIGN"];
  document.getElementById('tabs').innerHTML = tabs.map(t=>`<div class="tab-cat ${categoriaActiva==t?'active':''}" onclick="cambiarTab('${t}')">${t}</div>`).join('');
}

function cambiarTab(tab){
  categoriaActiva = tab;
  renderTabs();
  renderTodo();
}

function renderTodo(){
  let categorias = {
    "DIAMANTES": data.productos.filter(p=>p.id.includes('diamantes')),
    "SEGUIDORES": data.productos.filter(p=>p.id.includes('seguidores')),
    "SERVICIOS": data.productos.filter(p=>['numeros_virtuales','combo_decana','spam_3d','spam_5d','spam_7d'].includes(p.id)),
    "DESIGN": data.productos.filter(p=>p.id.includes('design'))
  };

  let html = '';
  for(let cat in categorias){
    let prods = categorias[cat].filter(prod => prod.disponible_en.includes(paisActual));
    if(prods.length > 0){
      html += `<div class="categoria ${categoriaActiva==cat?'active':''}"><div class="productos">`;
      html += prods.map(prod => {
        let precio = prod.precios[paisActual];
        let moneda = data.paises[paisActual].moneda;
        return `
        <div class="card">
          <h3>${prod.nombre}</h3>
          <p class="nota">${prod.nota || ''}</p>
          <p class="precio">${moneda}${precio}</p>
          <button onclick="addCarrito('${prod.id}')">+ AÑADIR AL CARRITO</button>
        </div>`;
      }).join('');
      html += `</div></div>`;
    }
  }
  document.getElementById('contenedor-categorias').innerHTML = html;
}

function addCarrito(id){
  carritoItems[id] = (carritoItems[id] || 0) + 1;
  renderCarrito();
}

function renderCarrito(){
  let items = Object.keys(carritoItems).map(id => {
    let prod = data.productos.find(p=>p.id==id);
    return `<div style="border-bottom:1px solid #222;padding:10px 0;display:flex;justify-content:space-between">${prod.nombre} <b>x${carritoItems[id]}</b></div>`
  }).join('');
  document.getElementById('items-carrito').innerHTML = items || '<p style="color:#555;text-align:center;margin-top:20px">CARRITO VACÍO</p>';
  let total = Object.keys(carritoItems).reduce((t,id)=>{
    let prod = data.productos.find(p=>p.id==id);
    return t + prod.precios[paisActual] * carritoItems[id];
  },0);
  document.getElementById('total').innerText = data.paises[paisActual].moneda + total;
  document.getElementById('cant-carrito').innerText = Object.values(carritoItems).reduce((a,b)=>a+b,0);
}

function renderMetodosPago(){
  let pagos = data.paises[paisActual].pagos;
  document.getElementById('metodos-pago').innerHTML = pagos.map(p=>`<label style="display:block;margin:10px 0;background:#111;padding:10px;border-radius:8px;border:1px solid #333"><input type="radio" name="pago" value="${p}"> ${p}</label>`).join('');
}

function comprarWhatsApp(){
  let pago = document.querySelector('input[name="pago"]:checked')?.value || 'No especificado';
  let msg = `Hola Garfield Store!%0A[PANEL PRO]%0APaís: ${data.paises[paisActual].nombre}%0AMétodo: ${pago}%0A%0AProductos:%0A`;
  Object.keys(carritoItems).forEach(id=>{let prod = data.productos.find(p=>p.id==id);msg += `${carritoItems[id]}x ${prod.nombre}%0A`;});
  msg += `%0ATOTAL: ${document.getElementById('total').innerText}`;
  window.open(`https://wa.me/51920726588?text=${msg}`);
}

function toggleCarrito(){ document.getElementById('carrito').classList.toggle('open'); }
document.getElementById('btn-carrito').onclick = toggleCarrito;

function toggleMusica(){
  let m=document.getElementById('musica');
  let btn=document.getElementById('btnMusica');
  if(musicaOn){m.pause(); btn.classList.remove('playing'); btn.innerText='🔇'}
  else{m.play(); btn.classList.add('playing'); btn.innerText='🔊'}
  musicaOn=!musicaOn;
}
</script>
</body>
</html>
