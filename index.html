<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luu Store - Tienda Oficial</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="nav">
    <div class="logo"><img src="logo.png"><h1>LUU STORE</h1></div>
    <div class="cart-icon" onclick="window.location='carrito.html'">🛒<span class="cart-badge" id="cartCount">0</span></div>
  </div>
</header>

<div class="container">
  <div class="hero">
    <h2>Tu tienda de <span>Free Fire</span> favorita 😼</h2>
    <p>Diamantes, Design, Spam y Seguidores. Entrega rápida y 100% segura</p>
    <button class="btn-primary" onclick="window.location='tienda.html'">ENTRAR A LA TIENDA</button>
  </div>

  <h3 class="section-title">¿Por qué nosotros?</h3>
  <div class="grid">
    <div class="product-card"><h4>⚡ Entrega Rápida</h4><p style="font-size:.85rem; color:#aaa">Mañanas y Noches</p></div>
    <div class="product-card"><h4>🛡️ 100% Seguro</h4><p style="font-size:.85rem; color:#aaa">Miles de clientes</p></div>
    <div class="product-card"><h4>💬 Soporte 24/7</h4><p style="font-size:.85rem; color:#aaa">Por WhatsApp</p></div>
    <div class="product-card"><h4>🌎 8 Monedas</h4><p style="font-size:.85rem; color:#aaa">Paga como quieras</p></div>
  </div>
</div>

<script src="monedas.js"></script><script src="productos.js"></script><script src="script.js"></script>
</body>
</html>
