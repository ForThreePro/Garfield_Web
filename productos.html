<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIENDA - Garfield Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="container nav">
    <div class="logo">GARFIELD<span>STORE</span></div>
    <button class="btn-menu" onclick="document.querySelector('.menu').classList.toggle('active')">☰</button>
    <nav class="menu">
      <a href="index.html" onclick="document.querySelector('.menu').classList.remove('active')">INICIO</a>
      <a href="productos.html" onclick="document.querySelector('.menu').classList.remove('active')">TIENDA</a>
      <a href="videos.html" onclick="document.querySelector('.menu').classList.remove('active')">MEDIA</a>
      <a href="carrito.html" onclick="document.querySelector('.menu').classList.remove('active')">CARRITO(<span id="menuTotal">0</span>)</a>
    </nav>
  </div>
</header>

<div class="container filtros">
  <select id="pais" onchange="cambiarPrecios()">
    <option value="PE">🇵🇪 PERU - S/</option><option value="CL">🇨🇱 CHILE - $</option><option value="AR">🇦🇷 ARGENTINA - $</option>
    <option value="MX">🇲🇽 MEXICO - $</option><option value="BO">🇧🇴 BOLIVIA - Bs</option><option value="UY">🇺🇾 URUGUAY - $</option>
    <option value="CO">🇨🇴 COLOMBIA - $</option><option value="EC">🇪🇨 ECUADOR - $</option>
  </select>
  <input type="text" id="buscador" placeholder="BUSCAR PRODUCTO..." onkeyup="buscarProducto()">
</div>

<main class="container" id="productos"></main>
<div id="popupOpciones" class="popup"></div>
<script src="app.js"></script>
</body>
</html>
